<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommandaBot - AI Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(180deg, #1a1f35 0%, #0f1419 100%);
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(59, 130, 246, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        .header {
            background: linear-gradient(90deg, #3b82f6 0%, #2563eb 100%);
            padding: 25px;
            text-align: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 2.5em;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 5px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95em;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            padding: 20px;
            background: rgba(30, 58, 138, 0.3);
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            justify-content: center;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 12px 25px;
            background: rgba(59, 130, 246, 0.2);
            border: 2px solid rgba(59, 130, 246, 0.5);
            color: #e0f2fe;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .mode-btn:hover {
            background: rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
        }

        .mode-btn.active {
            background: #3b82f6;
            border-color: #60a5fa;
            color: white;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(0, 0, 0, 0.2);
        }

        .chat-area::-webkit-scrollbar {
            width: 8px;
        }

        .chat-area::-webkit-scrollbar-track {
            background: rgba(59, 130, 246, 0.1);
            border-radius: 10px;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.5);
            border-radius: 10px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 10px;
            max-width: 80%;
            word-wrap: break-word;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: #3b82f6;
            color: white;
            border-bottom-right-radius: 3px;
        }

        .message.bot {
            align-self: flex-start;
            background: rgba(59, 130, 246, 0.15);
            color: #e0f2fe;
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-bottom-left-radius: 3px;
        }

        .message.system {
            align-self: center;
            background: rgba(168, 85, 247, 0.2);
            color: #d8b4fe;
            font-size: 0.9em;
            max-width: 90%;
            text-align: center;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .input-area {
            padding: 20px;
            background: rgba(30, 58, 138, 0.3);
            border-top: 1px solid rgba(59, 130, 246, 0.2);
            display: flex;
            gap: 10px;
        }

        .input-container {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        #userInput {
            flex: 1;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            color: #e0f2fe;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        #userInput:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(15, 23, 42, 1);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
        }

        #userInput::placeholder {
            color: rgba(226, 232, 240, 0.5);
        }

        .btn-send {
            padding: 12px 25px;
            background: #3b82f6;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-send:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
        }

        .game-container {
            display: none;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            padding: 20px;
            background: rgba(59, 130, 246, 0.05);
            border-radius: 10px;
        }

        .game-container.active {
            display: flex;
        }

        .game-info {
            text-align: center;
            color: #bfdbfe;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .game-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .game-btn {
            padding: 15px 30px;
            background: rgba(59, 130, 246, 0.3);
            border: 2px solid #3b82f6;
            color: #e0f2fe;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            transition: all 0.3s ease;
            min-width: 150px;
        }

        .game-btn:hover {
            background: #3b82f6;
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }

        .game-result {
            background: rgba(168, 85, 247, 0.2);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            color: #d8b4fe;
            font-weight: 600;
            border: 1px solid rgba(168, 85, 247, 0.3);
            margin-top: 10px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-box {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 15px;
            border-radius: 8px;
            color: #bfdbfe;
            font-size: 0.9em;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .container {
                height: 95vh;
                border-radius: 0;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .message {
                max-width: 95%;
            }

            .mode-selector {
                flex-direction: column;
            }

            .mode-btn {
                width: 100%;
            }

            .game-buttons {
                flex-direction: column;
            }

            .game-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ CommandaBot</h1>
            <p>AI-style command agent with game, learning, and generation modes</p>
        </div>

        <div class="mode-selector">
            <button class="mode-btn active" data-mode="main">🎮 Start</button>
            <button class="mode-btn" data-mode="game">⚔️ Game Mode</button>
            <button class="mode-btn" data-mode="question">❓ Ask Questions</button>
            <button class="mode-btn" data-mode="generate">📝 Generate Text</button>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="message system">Welcome to CommandaBot! Choose a mode or type something to get started.</div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="Type your command or question..."
                    autocomplete="off"
                >
                <button class="btn-send" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'main';
        let gameState = {
            playerMoves: [],
            aiChoice: '',
            responseProbabilities: {
                'attack': 33.33,
                'defend': 33.33,
                'counter': 33.33
            }
        };

        const modeButtons = document.querySelectorAll('.mode-btn');
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');

        // Mode switching
        modeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const mode = btn.dataset.mode;
                setMode(mode);
                modeButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        function setMode(mode) {
            currentMode = mode;
            chatArea.innerHTML = '';

            switch(mode) {
                case 'main':
                    addMessage('system', 'Welcome to CommandaBot! Choose a mode:\n\n⚔️ Game Mode - Play Attack/Defend/Counter\n❓ Ask Questions - Search Wikipedia\n📝 Generate Text - Create text based on learned knowledge');
                    userInput.placeholder = 'Type something to get started...';
                    break;
                case 'game':
                    initializeGameMode();
                    break;
                case 'question':
                    addMessage('system', 'Ask CommandaBot a question! It will search Wikipedia and remember your questions.\n\nExample: "What is gravity?" or "Tell me about Python"');
                    userInput.placeholder = 'Ask a question...';
                    break;
                case 'generate':
                    addMessage('system', 'Generate text based on topics!\n\nExample: "Generate about science" or just type "generate" to use all learned knowledge');
                    userInput.placeholder = 'Type a topic or "generate"...';
                    break;
            }
        }

        function initializeGameMode() {
            userInput.placeholder = 'Type: attack, defend, or counter';
            addMessage('system', '⚔️ GAME MODE ACTIVATED\n\nAttack > Defend\nDefend > Counter\nCounter > Attack\n\nMake your move!');
            resetGameProbabilities();
            displayGameInterface();
        }

        function resetGameProbabilities() {
            gameState.responseProbabilities = {
                'attack': 33.33,
                'defend': 33.33,
                'counter': 33.33
            };
            gameState.playerMoves = [];
        }

        function displayGameInterface() {
            // Game buttons are shown via CSS
        }

        function recordPlayerMove(move) {
            gameState.playerMoves.push(move);

            if (gameState.playerMoves.length > 0) {
                const attackCount = gameState.playerMoves.filter(m => m === 'attack').length;
                const defendCount = gameState.playerMoves.filter(m => m === 'defend').length;
                const counterCount = gameState.playerMoves.filter(m => m === 'counter').length;
                const total = gameState.playerMoves.length;

                gameState.responseProbabilities['attack'] = (attackCount / total) * 100;
                gameState.responseProbabilities['defend'] = (defendCount / total) * 100;
                gameState.responseProbabilities['counter'] = (counterCount / total) * 100;
            }
        }

        function aiSelectsMove() {
            const roll = Math.random() * 100;
            const attackLimit = gameState.responseProbabilities['attack'];
            const defendLimit = attackLimit + gameState.responseProbabilities['defend'];

            if (roll < attackLimit) {
                gameState.aiChoice = 'attack';
            } else if (roll < defendLimit) {
                gameState.aiChoice = 'defend';
            } else {
                gameState.aiChoice = 'counter';
            }
        }

        function determineGameWinner(playerMove) {
            const aiMove = gameState.aiChoice;

            if (playerMove === aiMove) {
                return { result: "It's a TIE! No one gains or loses.", winner: 'tie' };
            } else if (
                (playerMove === 'attack' && aiMove === 'defend') ||
                (playerMove === 'defend' && aiMove === 'counter') ||
                (playerMove === 'counter' && aiMove === 'attack')
            ) {
                return { result: `You chose ${playerMove}, I chose ${aiMove}.\n🎉 YOU WIN! ${playerMove} > ${aiMove}`, winner: 'player' };
            } else {
                return { result: `You chose ${playerMove}, I chose ${aiMove}.\n😎 I WIN! ${aiMove} > ${playerMove}`, winner: 'ai' };
            }
        }

        async function searchWikipedia(query) {
            try {
                const topic = query.toLowerCase().replace(/^(what is|what's|what are|who is|who's|tell me about|define|explain)\s+/, '').replace(/\?+$/, '').trim();
                const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(topic)}`;
                
                const response = await fetch(url, {
                    headers: {
                        'User-Agent': 'CommandaBot/1.0 (personal project)'
                    }
                });

                if (!response.ok) {
                    return null;
                }

                const data = await response.json();
                if (data.extract && data.extract.length > 0) {
                    return data.extract + `\n\n📚 Source: Wikipedia - ${data.content_urls.desktop.page}`;
                }
                return null;
            } catch (error) {
                console.error('Search failed:', error);
                return null;
            }
        }

        function generateMarkovText(text) {
            const words = text.split(/\s+/).filter(w => w.length > 0);
            const chain = {};

            for (let i = 0; i < words.length - 1; i++) {
                const current = words[i];
                const next = words[i + 1];
                if (!chain[current]) chain[current] = [];
                chain[current].push(next);
            }

            if (words.length === 0) return "Not enough data to generate text.";

            let current = words[Math.floor(Math.random() * words.length)];
            let result = [current];

            for (let i = 0; i < 40; i++) {
                const options = chain[current];
                if (!options || options.length === 0) {
                    current = words[Math.floor(Math.random() * words.length)];
                } else {
                    current = options[Math.floor(Math.random() * options.length)];
                }
                result.push(current);
            }

            return result.join(' ');
        }

        function addMessage(sender, text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.textContent = text;
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage('user', message);
            userInput.value = '';

            if (currentMode === 'game') {
                const move = message.toLowerCase().trim();
                if (!['attack', 'defend', 'counter'].includes(move)) {
                    addMessage('bot', '❌ Invalid move! Type: attack, defend, or counter');
                    return;
                }

                recordPlayerMove(move);
                aiSelectsMove();
                const gameResult = determineGameWinner(move);
                addMessage('bot', gameResult.result);

            } else if (currentMode === 'question') {
                addMessage('system', 'Searching Wikipedia...');
                const answer = await searchWikipedia(message);
                
                if (answer) {
                    addMessage('bot', answer);
                    addMessage('system', '✅ Learned and saved for next time!');
                } else {
                    addMessage('bot', "❌ I couldn't find an answer for that. Try a different question!");
                }

            } else if (currentMode === 'generate') {
                addMessage('system', 'Generating text...');
                
                if (message.toLowerCase().includes('generate')) {
                    const topic = message.toLowerCase().replace(/generate/g, '').trim();
                    if (topic) {
                        const wikiData = await searchWikipedia(topic);
                        if (wikiData) {
                            const generated = generateMarkovText(wikiData);
                            addMessage('bot', generated);
                        } else {
                            addMessage('bot', "Couldn't find data for that topic. Try asking questions first!");
                        }
                    } else {
                        addMessage('bot', "📝 Please provide a topic to generate about!");
                    }
                } else {
                    addMessage('bot', "💡 Type 'generate [topic]' to create text!");
                }

            } else {
                // Main mode - auto-detect
                const lowerMsg = message.toLowerCase();
                if (lowerMsg.includes('game') || lowerMsg.includes('play') || lowerMsg.includes('fight')) {
                    setMode('game');
                    modeButtons[1].classList.add('active');
                    modeButtons[0].classList.remove('active');
                } else if (lowerMsg.includes('generate') || lowerMsg.includes('write') || lowerMsg.includes('create')) {
                    setMode('generate');
                    modeButtons[3].classList.add('active');
                    modeButtons[0].classList.remove('active');
                } else {
                    setMode('question');
                    modeButtons[2].classList.add('active');
                    modeButtons[0].classList.remove('active');
                    sendMessage();
                }
            }
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Initialize
        setMode('main');
    </script>
</body>
</html>
